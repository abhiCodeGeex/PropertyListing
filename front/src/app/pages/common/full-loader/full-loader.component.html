@if(loader.loading()) {
  <div class="full-page-loader">
    <div class="full-page-loader__panel" aria-live="polite" aria-busy="true">
      <div class="full-page-loader__orb"></div>
      <div class="full-page-loader__ring"></div>
      <div class="full-page-loader__copy">
        <strong>Loading</strong>
        <span>Please wait while we prepare the latest data.</span>
      </div>
    </div>
  </div>
}
